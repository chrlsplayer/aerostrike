services:
  - type: web
    name: bubble-break
    runtime: node
    plan: free
    buildCommand: echo "no build needed"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
